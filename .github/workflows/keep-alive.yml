name: Keep App Alive

on:
  schedule:
    # Ping every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Deployment
        run: |
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL secret is not set yet."
            echo "Once your app is deployed on Render, copy the URL (e.g. https://refine.onrender.com) and add it to your GitHub repo Settings -> Secrets and variables -> Actions as APP_URL."
          else
            echo "Sending heartbeat ping to $URL/api/health..."
            curl -s -f "$URL/api/health" || curl -s -f "$URL" || echo "Heartbeat ping completed."
          fi
